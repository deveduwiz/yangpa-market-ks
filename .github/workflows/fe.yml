name: FE - Yangpa Market to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'fe/**'
      - '.github/workflows/fe.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      # VITE_* 는 빌드 시점에 번들로 박힌다.
      # 값은 리포지토리 Secrets 에서 주입한다 (.env.production 은 더 이상 커밋하지 않음).
      #   Settings > Secrets and variables > Actions > Secrets
      - name: Build
        working-directory: fe
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_BAY_057FC3500 }}
          action: upload
          app_location: 'fe/dist'
          skip_app_build: true
          output_location: ''
