# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - func-yangpa

on:
  push:
    branches:
      - main
    paths:
      - 'func/**'
      - '.github/workflows/func.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node 20.x Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: 'Resolve Project Dependencies Using Npm'
        shell: bash
        run: |
          pushd './func'
          npm install
          npm run build --if-present
          popd

      - name: Zip artifact for deployment
        run: |
          cd func
          zip -r ../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'func-yangpa'
          slot-name: 'Production'
          package: '.'
          publish-profile: ${{ secrets.secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9D8D06C179FF4DC2BADE65A5F7BDFBAF }}
          sku: 'flexconsumption'
