openapi: 3.0.3
info:
  title: 양파마켓 API
  description: 중고거래 플랫폼 REST API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: 개발 서버

tags:
  - name: Members
    description: 회원 관련 API
  - name: Sales
    description: 상품 관련 API
  - name: Favorites
    description: 찜 관련 API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: 에러 메시지

    Member:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: user@example.com
        name:
          type: string
          example: 홍길동

    MemberDetail:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: user@example.com
        name:
          type: string
          example: 홍길동
        createdAt:
          type: string
          format: date-time
        salesCount:
          type: integer
          example: 5
        favoritesCount:
          type: integer
          example: 3

    Sale:
      type: object
      properties:
        id:
          type: integer
          example: 1
        productName:
          type: string
          example: 양파 10kg
        description:
          type: string
          example: 국산 햇양파입니다
        price:
          type: integer
          example: 18000
        email:
          type: string
          example: seller@example.com
        photo:
          type: string
          example: product_1723939200000.jpg
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sellerName:
          type: string
          nullable: true
          example: 판매자
        isFavorite:
          type: boolean
          example: false
        favoriteCount:
          type: integer
          example: 3

paths:
  /members/sign-up:
    post:
      tags:
        - Members
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - password
              properties:
                email:
                  type: string
                  maxLength: 50
                  example: user@example.com
                name:
                  type: string
                  maxLength: 50
                  example: 홍길동
                password:
                  type: string
                  example: "1234"
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  member:
                    $ref: '#/components/schemas/Member'
                  message:
                    type: string
                    example: 회원가입이 완료되었습니다.
        '409':
          description: 이미 가입된 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /members/sign-in:
    post:
      tags:
        - Members
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: "1234"
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  message:
                    type: string
                    example: 로그인에 성공했습니다.
        '401':
          description: 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 존재하지 않는 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /members/me:
    get:
      tags:
        - Members
      summary: 내 정보 조회
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  member:
                    $ref: '#/components/schemas/MemberDetail'
                  message:
                    type: string
                    example: 내 정보 조회성공
        '401':
          description: 토큰 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 토큰 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sales:
    get:
      tags:
        - Sales
      summary: 상품 목록 조회
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: 페이지 번호 (1부터)
        - name: size
          in: query
          schema:
            type: integer
            default: 10
          description: 페이지당 개수
        - name: email
          in: query
          schema:
            type: string
          description: 판매자 이메일 필터
        - name: q
          in: query
          schema:
            type: string
          description: 상품명 검색어
        - name: productName
          in: query
          schema:
            type: string
          description: 상품명 검색어 (q의 별칭)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'
                  count:
                    type: integer
                    description: 전체 건수
                    example: 42
                  hasNext:
                    type: boolean
                    example: true
                  page:
                    type: integer
                    example: 1
                  size:
                    type: integer
                    example: 10
                  message:
                    type: string
                    example: sales 조회성공
        '401':
          description: 토큰 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Sales
      summary: 상품 등록
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - productName
                - description
                - price
                - photo
              properties:
                productName:
                  type: string
                  maxLength: 50
                  description: 상품명
                description:
                  type: string
                  description: 상품 설명
                price:
                  type: string
                  description: 가격 (정수 문자열)
                photo:
                  type: string
                  format: binary
                  description: 이미지 파일 (100MB 이하)
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  document:
                    $ref: '#/components/schemas/Sale'
                  message:
                    type: string
                    example: post 등록 성공
        '400':
          description: photo 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 토큰 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sales/favorites:
    get:
      tags:
        - Favorites
      summary: 내가 찜한 상품 목록
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'
                  count:
                    type: integer
                    example: 5
                  hasNext:
                    type: boolean
                    example: false
                  page:
                    type: integer
                    example: 1
                  size:
                    type: integer
                    example: 10
                  message:
                    type: string
        '401':
          description: 토큰 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sales/{id}:
    get:
      tags:
        - Sales
      summary: 상품 단건 조회
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 상품 ID
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'
                    description: 단건이지만 배열로 반환
                  message:
                    type: string
                    example: sale 조회성공
        '401':
          description: 토큰 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Sales
      summary: 상품 삭제
      description: 본인이 등록한 상품만 삭제 가능
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 상품 ID
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 삭제 완료
        '403':
          description: 남의 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 존재하지 않는 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sales/{id}/favorite:
    post:
      tags:
        - Favorites
      summary: 찜 추가
      description: 멱등 - 이미 찜한 상품도 에러 없이 처리
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 상품 ID
      responses:
        '200':
          description: 찜 추가 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  isFavorite:
                    type: boolean
                    example: true
                  favoriteCount:
                    type: integer
                    example: 3
        '404':
          description: 존재하지 않는 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Favorites
      summary: 찜 해제
      description: 멱등 - 찜하지 않은 상품도 에러 없이 처리
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 상품 ID
      responses:
        '200':
          description: 찜 해제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  isFavorite:
                    type: boolean
                    example: false
                  favoriteCount:
                    type: integer
                    example: 2
        '404':
          description: 존재하지 않는 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

